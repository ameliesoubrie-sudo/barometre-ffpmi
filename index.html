<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baromètre FFPMI 2025 des artisans photographes - Revenus et conditions d'activité</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gris:#717E85; --orange:#E25623; --orange-fonce:#C4471A; --brun:#655043;
  --encre:#263036; --texte:#3B464C; --trait:#DCE1E4; --voile:#F4F6F7; --fond:#FFFFFF;
  --alerte:#F9B233; --erreur:#B3261E; --choisi:#FDF3EF;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --encre:#EEF1F3; --texte:#CBD2D6; --gris:#9AA6AC; --trait:#3A4449; --voile:#232A2E; --fond:#1A1F22; --choisi:#3A2A22; }}
:root[data-theme="dark"]{ --encre:#EEF1F3; --texte:#CBD2D6; --gris:#9AA6AC; --trait:#3A4449; --voile:#232A2E; --fond:#1A1F22; --choisi:#3A2A22; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:Montserrat,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55}
.page{max-width:720px;margin:0 auto;padding:24px 20px 96px}
header.top{display:flex;align-items:center;gap:14px;padding:8px 0 28px;border-bottom:1px solid var(--trait);margin-bottom:36px}
header.top img{height:46px;width:auto;display:block;background:#fff;border-radius:8px;padding:4px 6px;margin-left:-6px}
.testband{background:#FEF6E4;color:#5A4210;border-left:4px solid var(--alerte);border-radius:10px;padding:12px 16px;font-size:.9rem;margin:0 0 28px}
.fb textarea{min-height:90px}
.q .msg.warn{margin:4px 0 12px}
details.calc{border:1.5px solid var(--trait);border-radius:10px;padding:12px 16px;margin:0 0 12px}
details.calc summary{cursor:pointer;font-weight:600;color:var(--orange)}
.calc-f{display:flex;flex-direction:column;gap:4px;margin:12px 0;font-size:.92rem;font-weight:500;color:var(--encre)}
.calc-f input{max-width:220px}
.calc-f small{color:var(--gris);font-weight:400;font-size:.8rem}
.calc-res{margin:14px 0 0;font-size:.95rem;color:var(--encre)}
.fb .q{margin-bottom:26px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.actions a{text-decoration:none;display:inline-block}
textarea.out{min-height:220px;font-size:.85rem}
.wordmark{font-weight:700;font-size:1.35rem;color:var(--encre);letter-spacing:.02em}
.wordmark-sub{font-size:.8rem;color:var(--gris);font-weight:500;line-height:1.3}
h1{font-weight:700;font-size:clamp(1.7rem,4.5vw,2.4rem);line-height:1.15;color:var(--encre);margin:0 0 8px}
.kicker{font-weight:600;color:var(--brun);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;margin:0 0 8px}
.audience{border-left:5px solid var(--brun);background:var(--voile);border-radius:0 12px 12px 0;padding:18px 20px;margin:22px 0 30px}
.audience-title{font-weight:700;color:var(--encre);font-size:clamp(1.15rem,3.4vw,1.4rem);line-height:1.3;margin:0 0 8px}
.audience p:last-child{margin:0}
.intro-h2{font-size:1.2rem;margin:0 0 12px}
.notfor{border:1.5px solid var(--trait);border-radius:12px;padding:16px 18px;margin:18px 0 24px}
.notfor-title{font-weight:600;color:var(--encre);margin:0 0 6px}
.notfor ul{margin:0;padding-left:20px}.notfor li{margin:4px 0}
.h1-sub{font-weight:500;color:var(--gris);font-size:1.1rem;margin:0 0 28px}
h2{font-weight:700;font-size:1.5rem;line-height:1.25;color:var(--encre);margin:0 0 28px}
p{margin:0 0 14px}
.intro p{max-width:62ch}
.facts{display:flex;flex-wrap:wrap;gap:10px 26px;margin:22px 0 28px;padding:18px 0;border-top:1px solid var(--trait);border-bottom:1px solid var(--trait);font-weight:500;color:var(--encre);font-size:.95rem}
.facts span b{font-weight:700}
details.notice{background:var(--voile);border-radius:10px;padding:16px 18px;margin:0 0 20px}
details.notice summary{cursor:pointer;font-weight:600;color:var(--encre)}
details.notice p{font-size:.9rem;margin:12px 0 0}
details.notice b{color:var(--encre)}
.todo{background:#FFF1D6;padding:0 4px;border-radius:3px}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:.95rem;margin:0 0 28px;cursor:pointer}
.consent input{width:22px;height:22px;accent-color:var(--orange);flex:none;margin-top:2px}
.progress{margin:0 0 30px}
.progress-label{font-size:.85rem;font-weight:600;color:var(--gris);margin-bottom:8px}
.progress-bar{height:4px;background:var(--trait);border-radius:2px;overflow:hidden}
.progress-bar i{display:block;height:100%;background:var(--orange);transition:width .35s ease}
.q{margin:0 0 34px;scroll-margin-top:20px}
.q-label{font-weight:600;color:var(--encre);font-size:1.05rem;margin:0 0 6px;line-height:1.45}
.q-help{font-size:.88rem;color:var(--gris);margin:0 0 12px}
.q-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--trait);border-radius:10px;cursor:pointer;background:var(--fond);transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gris)}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--orange);flex:none}
.opt.on{border-color:var(--orange);background:var(--choisi)}
.opt span{font-size:.97rem}
input[type=number],input[type=text],select,textarea{font:inherit;color:var(--encre);border:1.5px solid var(--trait);border-radius:10px;padding:11px 14px;background:var(--fond);width:100%;max-width:100%}
input[type=number]{max-width:180px}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(226,86,35,.18)}
.inline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.nsp{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.nsp input{accent-color:var(--orange);width:18px;height:18px}
.q.err .q-label{color:var(--erreur)}
.q-err{color:var(--erreur);font-size:.88rem;font-weight:600;margin-top:8px}
.msgs{margin:0 0 24px}
.msg{border-radius:10px;padding:14px 16px;margin:0 0 10px;font-size:.93rem;border-left:4px solid}
.msg.block{background:#FBEAE8;border-color:var(--erreur);color:#5F1712}
.msg.warn{background:#FEF6E4;border-color:var(--alerte);color:#5A4210}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--trait)}
button{font:inherit;font-weight:600;border-radius:999px;padding:13px 26px;cursor:pointer;border:1.5px solid transparent;font-size:1rem}
.btn-main{background:var(--orange);color:#fff}
.btn-main:hover{background:var(--orange-fonce)}
.btn-main:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--gris);border-color:var(--trait)}
.btn-ghost:hover{color:var(--encre);border-color:var(--gris)}
button:focus-visible,.opt:focus-within{outline:3px solid rgba(226,86,35,.35);outline-offset:2px}
.end h2{margin-bottom:14px}
.end .accent{display:block;width:48px;height:4px;background:var(--orange);border-radius:2px;margin:0 0 24px}
pre.test{background:var(--voile);padding:14px;border-radius:10px;font-size:.78rem;overflow:auto;max-height:280px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
footer.bottom{margin-top:56px;font-size:.8rem;color:var(--gris)}
@media (max-width:520px){ .page{padding:16px 16px 80px} .nav{flex-direction:column-reverse} .nav button{width:100%} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

</div>

const fmtE = n => new Intl.NumberFormat("fr-FR").format(n) + " €";
function revLabel(k){
  const [lo,hi] = REV_B[k];
  if (k==="def") return "Résultat négatif / déficit";
  if (k==="r0") return "0 €";
  if (hi===null) return `${fmtE(lo)} ou plus par an (${fmtE(lo/12)} par mois ou plus)`;
  if (lo===0) return `Plus de 0 à moins de ${fmtE(hi)} par an (moins de ${fmtE(hi/12)} par mois)`;
  return `De ${fmtE(lo)} à moins de ${fmtE(hi)} par an (${fmtE(lo/12)} à ${fmtE(hi/12)} par mois)`;
}
function bandLabel(B,k){
  const [lo,hi] = B[k];
  if (k==="def") return "Déficit";
  if (hi===0) return "0 €";
  if (hi===null) return `${fmtE(lo)} ou plus`;
  if (lo===0) return `Plus de 0 à moins de ${fmtE(hi)}`;
  return `De ${fmtE(lo)} à moins de ${fmtE(hi)}`;
}

  opts:[["vehicule","Véhicule (achat, location, carburant, entretien)."],["prevoyance","Prévoyance ou mutuelle."],["retraite","Épargne retraite (PER ou contrat retraite)."],["epargne_sal","Épargne salariale (intéressement, PEE, PER collectif)."],["repas","Repas."],["telephone","Téléphone, internet ou matériel informatique à usage mixte."],["logement","Loyer ou indemnité pour un espace de travail à votre domicile."],["autre","Autre."],["aucune","Aucune."]]},
 {id:"q28m",s:"s6",type:"single",when:r=>inScope(r)&&isIS(r)&&arr(r.q28a).some(v=>v!=="aucune"),label:"Au total, à combien estimez-vous ces dépenses en moyenne par mois ?",help:"Comptez uniquement la part qui vous bénéficie personnellement. Une estimation suffit.",
  opts:[["av_0_200","Moins de 200 € par mois."],["av_200_500","De 200 à moins de 500 € par mois."],["av_500_1000","De 500 à moins de 1 000 € par mois."],["av_1000_2000","De 1 000 à moins de 2 000 € par mois."],["av_2000p","2 000 € par mois ou plus."],["nsp","Je ne sais pas."]]},
 {id:"q28t",s:"s6",type:"single",when:r=>inScope(r)&&isIS(r),label:"Quel était le montant approximatif de la trésorerie de la société à la clôture de l'exercice 2025 ?",help:"Solde des comptes bancaires et des placements de la société, tel qu'il figure au bilan.",
  opts:[["tr_neg","Nulle ou négative (découvert)."],["tr_0_5","Moins de 5 000 €."],["tr_5_10","De 5 000 à moins de 10 000 €."],["tr_10_25","De 10 000 à moins de 25 000 €."],["tr_25_50","De 25 000 à moins de 50 000 €."],["tr_50_100","De 50 000 à moins de 100 000 €."],["tr_100p","100 000 € ou plus."],["nsp","Je ne sais pas."],["nr","Je préfère ne pas répondre."]]},
 {id:"q29",s:"s6",type:"single",when:r=>inScope(r)&&isSoc(r),label:"Avez-vous personnellement reçu des dividendes de cette structure en 2025 ?",help:"Montant avant fiscalité personnelle.",
  opts:[["aucun","Aucun."],["d_0_5","Plus de 0 à moins de 5 000 €."],["d_5_10","De 5 000 à moins de 10 000 €."],["d_10_20","De 10 000 à moins de 20 000 €."],["d_20_40","De 20 000 à moins de 40 000 €."],["d_40p","40 000 € ou plus."],["nsp","Je ne sais pas."],["nr","Je préfère ne pas répondre."]]},
 {id:"q30",s:"s6",type:"single",when:inScope,label:"Quelle part de l'ensemble de vos revenus professionnels personnels provenait de cette structure en 2025 ?",help:"Exclure les revenus du conjoint, les pensions et les allocations.",
  opts:[["aucun","Aucun revenu professionnel positif tiré de cette structure."],["0_25","Plus de 0 à moins de 25 %."],["25_50","De 25 à moins de 50 %."],["50_75","De 50 à moins de 75 %."],["75_100","De 75 à moins de 100 %."],["p100","100 %."],["nsp","Je ne sais pas."],["nr","Je préfère ne pas répondre."]]},

 {id:"q31",s:"s7",type:"multi",exclusive:"aucun",when:inScope,label:"Depuis le début de 2026, votre situation a-t-elle changé ?",help:"Plusieurs réponses possibles.",
  opts:[["developpe","J'ai développé mon activité photographique (plus de clients ou de commandes)."],["nouvelle_presta","J'ai lancé une nouvelle prestation ou spécialité."],["investi","J'ai fait un investissement important (matériel, studio, site internet...)."],["embauche","J'ai embauché (salarié, apprenti ou alternant)."],["reduit","J'ai réduit mon activité photographique."],["plus_autre","J'ai commencé ou augmenté une autre activité rémunérée."],["moins_autre","J'ai diminué ou arrêté une autre activité rémunérée."],["ouvert_local","J'ai ouvert ou pris un local professionnel."],["ferme_local","J'ai fermé ou quitté un local professionnel."],["statut","J'ai changé de statut juridique ou de régime fiscal."],["cesse","J'ai cessé mon activité photographique."],["autre","Autre changement important."],["aucun","Aucun de ces changements."]]},
 {id:"q31m",s:"s7",type:"single",when:r=>inScope(r)&&arr(r.q31).some(v=>["reduit","plus_autre","ferme_local","cesse","autre"].includes(v)),label:"Quel est le motif principal de cette réduction ou de ce changement ?",opts:[["eco","Raison économique."],["choix","Choix personnel."],["sante","Santé."],["retraite","Retraite."],["autre","Autre."]]},
 {id:"q31r",s:"s7",type:"single",when:inScope,label:"Depuis le début de 2026, le revenu que vous tirez de votre activité photographique est-il, par rapport à la même période de 2025 :",help:"Une tendance suffit, sans calcul précis.",opts:[["hausse","En hausse."],["stable","Stable."],["baisse","En baisse."],["nsp","Je ne sais pas encore."]]},
 {id:"q32",s:"s7",type:"single",when:laterPath,label:"Pour les douze prochains mois, quelle est votre intention principale ?",opts:[["developper","Développer mon activité photographique."],["maintenir","Maintenir mon activité à un niveau comparable."],["reduire","Réduire mon activité."],["cesser","Cesser mon activité."],["nsp","Je ne sais pas encore."]]},
 {id:"q33",s:"s7",type:"single",when:laterPath,label:"Êtes-vous adhérent d'une organisation professionnelle ?",opts:[["ffpmi","FFPMI."],["autre","Une autre organisation."],["plusieurs_ffpmi","Plusieurs organisations, dont la FFPMI."],["plusieurs_hors","Plusieurs organisations, hors FFPMI."],["aucune","Aucune."],["nr","Je préfère ne pas répondre."]]},
 {id:"q34",s:"s7",type:"textarea",optional:true,when:laterPath,label:"Souhaitez-vous préciser un élément important pour comprendre votre situation ?",help:"Facultatif. Merci de ne pas indiquer votre nom, celui de votre entreprise ou toute information permettant de vous identifier."}
];
/* Réponses affichées sans point final */
const noDot = l => String(l).replace(/(?<!\.)\.$/,"");
Q.forEach(q => { if (q.opts) q.opts.forEach(o => o[1] = noDot(o[1])); });
const QMAP = Object.fromEntries(Q.map(q=>[q.id,q]));
const qLabel = (q,r) => typeof q.label==="function" ? q.label(r) : q.label;
const qHelp = (q,r) => typeof q.help==="function" ? q.help(r) : q.help;
function qOpts(q,r){
  if (q.optsFn) return q.optsFn(r).map(o=>[o[0],noDot(o[1])]);
  if (q.dynamicFrom) { const all = QMAP[q.dynamicFrom].opts; const sel = arr(r[q.dynamicFrom]); return all.filter(o=>sel.includes(o[0])); }
  return q.opts || [];
}
function optLabel(qid, v){
  const q = QMAP[qid]; if (!q) return v;
  if (qid==="q14") { const o = QMAP.q13.opts.find(o=>o[0]===v); return o ? o[1].replace(/\.$/,"") : v; }
  if (qid==="q26") return REV_B[v] ? revLabel(v) : ({nsp:"Je ne sais pas l'estimer",nr:"Je préfère ne pas répondre"}[v]||v);
  if (qid==="q2") { const d = DEPTS.find(d=>d.c===v); return d ? `${d.c} - ${d.n}` : v; }
  const o = (q.opts||[]).find(o=>o[0]===v); return o ? o[1].replace(/\.$/,"") : v;
}
const visible = (q,r) => !q.when || !!q.when(r);

/* Valeurs déduites automatiquement */
function applyAuto(r){
  const acts = arr(r.q13);
  if (inScope(r) && acts.length===1){ r.q14 = acts[0]; r.q14p = "75_100"; }
  if (inScope(r) && Number(r.q3)===2025) r.q24 = "pas_2024";
  return r;
}

/* Contrôles de cohérence : test(r) === true signale un problème */
const RULES = [
 {id:"b_micro_forme",s:"s2",type:"block",test:r=>isMicro(r)&&["sarl","sas","sasu"].includes(r.q7),msg:"Le régime micro n'est pas compatible avec une SARL, une SAS ou une SASU. Vérifiez la forme juridique ou le régime fiscal."},
 {id:"w_debut",s:"s1",type:"warn",test:r=>inScope(r)&&Number(r.q3)===2025&&(r.q4==="an"||(r.q4==="partiel"&&r.q4r&&r.q4r!=="debut")),msg:"Vous indiquez avoir démarré en 2025 : votre activité était-elle vraiment ouverte toute l'année, ou s'agit-il d'un début d'activité ?"},
 {id:"w_photo_aucune",s:"s3",type:"warn",test:r=>{const a=arr(r.q13);return a.length&&a.every(x=>PHOTO_ACTS.includes(x))&&r.q15==="aucune";},msg:"Vous n'avez coché que des activités photographiques, mais indiquez qu'aucune part du chiffre d'affaires ne provient de la photographie."},
 {id:"w_photo_100",s:"s3",type:"warn",test:r=>arr(r.q13).some(x=>["video","formation","vente"].includes(x))&&r.q15==="p100",msg:"Vous avez coché la vidéo, la formation ou la vente, mais indiquez que 100 % du chiffre d'affaires provient de la photographie."},
 {id:"b_weeks",s:"s4",type:"block",test:r=>r.q20c!=="nsp"&&Number(r.q20c)>=openWeeks(r),msg:"Le nombre de semaines de congés doit être inférieur au nombre de semaines d'ouverture indiqué en partie 1."},
 {id:"w_heures",s:"s4",type:"warn",test:r=>r.q19==="60p"&&(workedWeeks(r)||0)>=49,msg:"60 heures ou plus par semaine pendant 49 semaines ou plus représentent plus de 2 900 heures dans l'année. Pouvez-vous vérifier ?"},
 {id:"w_micro_ca",s:"s5",type:"warn",test:r=>isMicro(r)&&CA_B[r.q23]&&CA_B[r.q23][0]>=100000,msg:"Un chiffre d'affaires de 100 000 € ou plus dépasse probablement le plafond de la micro-entreprise. Pouvez-vous vérifier le régime ou le montant ?"},
 {id:"w_2024",s:"s5",type:"warn",test:r=>Number(r.q3)&&Number(r.q3)<2024&&r.q24==="pas_2024",msg:"Vous indiquez exercer depuis avant 2024, mais ne pas avoir exercé en 2024. Pouvez-vous vérifier ?"},
 {id:"b_rev_ca",s:"s6",type:"block",test:r=>{const c=CA_B[r.q23],v=REV_B[r.q26];if(!c||!v||r.q26==="def")return false;if(c[1]===0)return v[1]!==0;return c[1]!==null&&v[0]>=c[1];},msg:"Le revenu personnel indiqué est supérieur au chiffre d'affaires déclaré en partie 5. Vérifiez l'une des deux réponses."},
 {id:"b_q30",s:"s6",type:"block",test:r=>revPositive(r)&&r.q30==="aucun",msg:"Vous indiquez un revenu positif, mais aucun revenu professionnel positif tiré de cette structure. Vérifiez l'une des deux réponses."},
 {id:"w_cesse",s:"s7",type:"warn",test:r=>r.q1==="oui_toujours"&&arr(r.q31).includes("cesse"),msg:"En début de questionnaire, vous indiquiez exercer toujours votre activité. Avez-vous bien cessé depuis ?"}
];
const RULE_MAP = Object.fromEntries(RULES.map(r=>[r.id,r]));

</script>
<script>
(function(){
const app = document.getElementById("app");
const brand = document.getElementById("brand");
brand.innerHTML = CONFIG.LOGO_URL
  ? `<img src="${CONFIG.LOGO_URL}" alt="FFPMI - Fédération Française de la Photographie et des Métiers de l'Image">`
  : `<div><div class="wordmark">FFPMI</div><div class="wordmark-sub">Fédération Française de la Photographie<br>et des Métiers de l'Image</div></div>`;

const R = {};                 // réponses
let step = 0;                 // 0 = accueil, 1..7 = parties, 8 = fin
let ackWarn = {};             // avertissements déjà affichés par partie
const alertes = new Set();    // avertissements maintenus par le répondant
const CALC = {ca:"",cot:"",dep:"",msg:""};  // aide au calcul micro (montants jamais envoyés)
const t0 = Date.now();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todo = v => v ? esc(v) : `<span class="todo">[à compléter]</span>`;

function notice(){
  return `<details class="notice"><summary>Notice d'information sur vos données</summary>
  <p><b>Responsable du traitement.</b> Fédération Française de la Photographie et des Métiers de l'Image (FFPMI), SIREN 319 403 697, ${todo(CONFIG.ADRESSE_SIEGE)}, représentée par sa présidente. Contact : ${todo(CONFIG.CONTACT_RGPD)}.</p>
  <p><b>Finalité.</b> Les réponses servent uniquement à produire le Baromètre FFPMI des revenus et conditions d'activité des artisans photographes, publié sous forme de statistiques regroupées. Elles ne sont utilisées ni à des fins commerciales, ni pour vous contacter, ni pour vérifier votre situation individuelle.</p>
  <p><b>Base légale.</b> Votre consentement. La participation est facultative et vous pouvez interrompre le questionnaire à tout moment.</p>
  <p><b>Données collectées.</b> Uniquement vos réponses. Aucun nom, adresse email ou numéro SIRET n'est demandé, et la FFPMI n'enregistre pas votre adresse IP. Les hébergeurs techniques peuvent conserver temporairement des journaux de connexion, pour la sécurité de leurs services.</p>
  <p><b>Anonymat et publication.</b> Aucun résultat n'est publié pour un groupe de moins de 10 répondants. Les croisements qui pourraient permettre de reconnaître une personne ne sont pas publiés.</p>
  <p><b>Destinataires et hébergement.</b> Les réponses individuelles ne sont accessibles qu'aux personnes chargées de l'étude au sein de la FFPMI. Elles sont enregistrées dans une base de données hébergée par Supabase Inc., sur des serveurs situés en ${esc(CONFIG.SUPABASE_REGION)}. La page du questionnaire est hébergée par GitHub Inc. (GitHub Pages). Ces prestataires agissent comme sous-traitants de la FFPMI. Ce sont des sociétés américaines : si des données devaient être transférées hors de l'Union européenne, ce transfert serait encadré par les garanties prévues par le RGPD, notamment les clauses contractuelles types de la Commission européenne.</p>
  <p><b>Durée de conservation.</b> Les réponses individuelles sont conservées ${esc(CONFIG.DUREE_CONSERVATION)}, afin de permettre la comparaison avec les éditions suivantes, puis supprimées. Les résultats regroupés publiés sont conservés sans limite de durée.</p>
  <p><b>Vos droits.</b> Vous disposez d'un droit d'accès, de rectification, d'effacement, de limitation et d'opposition, ainsi que du droit de retirer votre consentement. Comme aucune donnée d'identification n'est collectée, il peut être impossible de retrouver votre réponse après son envoi. Vous pouvez adresser une réclamation à la CNIL (www.cnil.fr).</p>
  </details>`;
}

function renderIntro(){
  let already = false; try { already = localStorage.getItem("barometre_ffpmi_2025_envoye")==="1"; } catch(e){}
  app.innerHTML = `<section class="intro">
    ${CONFIG.MODE_TEST ? `<div class="testband"><b>Version de test.</b> Vos réponses ne sont pas enregistrées. À la fin, quelques questions vous permettront de donner votre avis sur le questionnaire.</div>` : ""}
    <p class="kicker">Baromètre FFPMI 2025</p>
    <h1>Revenus des artisans photographes</h1>
    <div class="audience">
      <p class="audience-title">Cette enquête s'adresse uniquement aux artisans photographes.</p>
      <p>Elle ne concerne pas l'ensemble des photographes professionnels. Son but est de mesurer la réalité économique propre aux artisans photographes : activité, temps de travail, chiffre d'affaires et revenu personnel.</p>
    </div>
    <h2 class="intro-h2">Qu'est-ce qu'un artisan photographe ?</h2>
    <p>C'est un photographe dont l'entreprise est <b>immatriculée au titre d'une activité artisanale</b>, c'est-à-dire inscrite auprès de la <b>Chambre de métiers et de l'artisanat (CMA)</b>, quel que soit son statut : micro-entreprise, entreprise individuelle ou société. La photographie de prestation (portrait, mariage, naissance, studio, entreprise...) fait partie des métiers de l'artisanat.</p>
    <p>Les statistiques disponibles mélangent souvent des situations très différentes. Ce baromètre veut donner une image fidèle des artisans photographes, pour défendre le métier auprès des pouvoirs publics.</p>
    <div class="notfor"><p class="notfor-title">Cette enquête ne vous concerne pas si :</p>
      <ul><li>votre activité est immatriculée comme activité commerciale ou libérale, sans inscription à la CMA ;</li>
      <li>vous exercez uniquement sous le régime des artistes-auteurs ;</li>
      <li>vous êtes photographe salarié.</li></ul>
      <p class="q-help" style="margin:8px 0 0">En cas de doute, votre extrait d'immatriculation indique si votre activité est artisanale ; votre CMA peut aussi vous le confirmer.</p></div>
    <p>Les questions portent sur l'année 2025, sauf indication contraire. Les montants sont demandés par tranches. Merci de répondre pour votre situation personnelle ; lorsque la question concerne l'entreprise, cela est précisé.</p>
    <p>Artisans photographes, adhérents ou non de la FFPMI : plus vous serez nombreux à répondre, plus les résultats seront fidèles à la réalité du métier. N'hésitez pas à partager l'enquête avec d'autres artisans photographes.</p>
    <div class="facts"><span><b>12 à 15 minutes</b></span><span><b>Anonyme</b></span><span>Aucun résultat publié sous <b>10 répondants</b></span></div>
    ${already ? `<div class="msg warn">Une réponse a déjà été envoyée depuis cet appareil. Merci de ne répondre qu'une seule fois par personne.</div>` : ""}
    ${notice()}
    <label class="consent"><input type="checkbox" id="consent"> <span>J'ai pris connaissance de la notice d'information et j'accepte que mes réponses soient utilisées dans les conditions décrites.</span></label>
    <button class="btn-main" id="start" disabled>Commencer le questionnaire</button>
  </section>`;
  const c = document.getElementById("consent"), s = document.getElementById("start");
  c.onchange = () => s.disabled = !c.checked;
  s.onclick = () => go(1);
}

const secQs = sid => Q.filter(q => q.s===sid && visible(q,R));
function nextStep(from, dir){
  let s = from + dir;
  while (s>=1 && s<=7 && secQs(SECTIONS[s-1].id).length===0) s += dir;
  return s;
}

function qHTML(q){
  const v = R[q.id];
  let body = "";
  const help = qHelp(q,R);
  if (q.type==="single" || q.type==="multi"){
    const type = q.type==="single" ? "radio" : "checkbox";
    const sel = q.type==="multi" ? arr(v) : [v];
    body = `<div class="q-opts" role="${q.type==="single"?"radiogroup":"group"}">` + qOpts(q,R).map(([val,lab]) =>
      `<label class="opt ${sel.includes(val)?"on":""}"><input type="${type}" name="${q.id}" value="${esc(val)}" ${sel.includes(val)?"checked":""}><span>${esc(q.id==="q14"?lab.replace(/\.$/,""):lab)}</span></label>`).join("") + `</div>`;
  } else if (q.type==="dept"){
    body = `<select name="${q.id}"><option value="">Choisir un département</option>` + DEPTS.map(d=>`<option value="${d.c}" ${v===d.c?"selected":""}>${d.c} - ${esc(d.n)}</option>`).join("") + `</select>`;
  } else if (q.type==="number"){
    body = `<div class="inline"><input type="number" inputmode="numeric" name="${q.id}" min="${q.min}" max="${q.max}" value="${v??""}" placeholder="${q.placeholder||""}">${q.suffix?`<span>${q.suffix}</span>`:""}</div>`;
  } else if (q.type==="weeks"){
    const max = openWeeks(R);
    body = `<p class="q-help">Votre activité était ouverte ${max} semaines en 2025.</p>
      <div class="inline"><input type="number" inputmode="numeric" name="${q.id}" min="1" max="${max}" value="${v&&v!=="nsp"?v:""}" ${v==="nsp"?"disabled":""}><span>semaines</span>
      <label class="nsp"><input type="checkbox" data-nsp="${q.id}" ${v==="nsp"?"checked":""}> Je ne sais pas</label></div>`;
  } else if (q.type==="offweeks"){
    const max = openWeeks(R) - 1;
    const w = v!==undefined && v!=="" && v!=="nsp" ? openWeeks(R) - Number(v) : null;
    body = `<p class="q-help">Votre activité était ouverte ${openWeeks(R)} semaines en 2025.</p>
      <div class="inline"><input type="number" inputmode="numeric" name="${q.id}" min="0" max="${max}" value="${v&&v!=="nsp"?v:(v==="0"?"0":"")}" ${v==="nsp"?"disabled":""}><span>semaines</span>
      <label class="nsp"><input type="checkbox" data-nsp="${q.id}" ${v==="nsp"?"checked":""}> Je ne sais pas</label></div>
      <p class="q-help" id="wk-${q.id}" style="margin-top:10px">${w!==null && w>0 ? `Soit ${w} semaines travaillées.` : ""}</p>`;
  } else if (q.type==="text"){
    body = `<input type="text" name="${q.id}" value="${esc(v||"")}" placeholder="${q.placeholder||""}">`;
  } else if (q.type==="textarea"){
    body = `<textarea name="${q.id}" maxlength="2000">${esc(v||"")}</textarea>`;
  }
  const warn = q.warnFn ? q.warnFn(R) : "";
  let calc = "";
  if (q.calcMicro && isMicro(R)){
    const inp = (k,l,h) => `<label class="calc-f"><span>${l}</span><input type="number" inputmode="numeric" min="0" data-calc="${k}" value="${esc(CALC[k])}" placeholder="0"><small>${h}</small></label>`;
    calc = `<details class="calc" ${CALC.msg?"open":""}><summary>Je ne sais pas quel montant indiquer : aide au calcul</summary>
      <p class="q-help">Ces montants servent uniquement au calcul et ne sont pas envoyés. Seule la tranche est enregistrée.</p>
      ${inp("ca","Chiffre d'affaires déclaré pour 2025 (€)","Total de vos déclarations URSSAF de l'année")}
      ${inp("cot","Cotisations sociales payées pour 2025 (€)","Montant indiqué dans votre espace URSSAF")}
      ${inp("dep","Dépenses professionnelles réelles en 2025 (€)","Matériel, loyer, logiciels, déplacements, formation, assurance, sous-traitance...")}
      <button type="button" class="btn-ghost" id="calcBtn">Calculer et choisir la tranche</button>
      ${CALC.msg?`<p class="calc-res">${CALC.msg}</p>`:""}</details>`;
  }
  return `<div class="q" id="blk-${q.id}"><div class="q-label">${esc(qLabel(q,R))}</div>${help?`<p class="q-help">${esc(help)}</p>`:""}${warn?`<div class="msg warn">${esc(warn)}</div>`:""}${calc}${body}</div>`;
}

function renderSection(msgs){
  const sec = SECTIONS[step-1];
  const qs = secQs(sec.id);
  app.innerHTML = `<div class="progress"><div class="progress-label">Partie ${step} sur 7</div><div class="progress-bar"><i style="width:${(step-1)/7*100}%"></i></div></div>
    <h2>${esc(sec.title)}</h2>
    <div class="msgs">${(msgs||[]).map(m=>`<div class="msg ${m.type}">${esc(m.msg)}</div>`).join("")}</div>
    <form id="f" novalidate>${qs.map(qHTML).join("")}
      <div class="hp" aria-hidden="true"><label>Ne pas remplir <input type="text" name="site_web" tabindex="-1" autocomplete="off"></label></div>
      <div class="nav"><button type="button" class="btn-ghost" id="back">Retour</button><button type="submit" class="btn-main" id="next">${nextStep(step,1)>7?"Envoyer mes réponses":"Continuer"}</button></div>
    </form>`;
  const f = document.getElementById("f");
  f.addEventListener("change", e => {
    const el = e.target;
    if (el.dataset.nsp){ R[el.dataset.nsp] = el.checked ? "nsp" : ""; return renderSection(); }
    if (el.dataset.calc) return;
    const q = QMAP[el.name]; if (!q) return;
    if (q.type==="multi"){
      let cur = arr(R[q.id]);
      if (el.checked){ cur.push(el.value); if (q.exclusive){ cur = el.value===q.exclusive ? [q.exclusive] : cur.filter(x=>x!==q.exclusive); } }
      else cur = cur.filter(x=>x!==el.value);
      R[q.id] = [...new Set(cur)];
      if (q.id==="q13" && R.q14 && !R.q13.includes(R.q14)) delete R.q14;
      renderSection();
    } else if (q.type==="single" || q.type==="dept"){ R[q.id] = el.value; if (q.id==="q17" && el.value==="non" && R.q22==="autre_act") delete R.q22; renderSection(); }
  });
  f.addEventListener("input", e => {
    const el = e.target; const q = QMAP[el.name];
    if (q && ["number","weeks","offweeks","text","textarea"].includes(q.type)) R[q.id] = el.value.trim();
    if (q && q.type==="offweeks"){ const n = Number(el.value), w = openWeeks(R) - n; const out = document.getElementById("wk-"+q.id);
      if (out) out.textContent = el.value!=="" && Number.isInteger(n) && n>=0 && w>0 ? `Soit ${w} semaines travaillées.` : ""; }
  });
  f.addEventListener("input", e => { const k = e.target.dataset && e.target.dataset.calc; if (k) CALC[k] = e.target.value; });
  const cb = document.getElementById("calcBtn");
  if (cb) cb.onclick = () => {
    const n = k => Math.max(0, Number(String(CALC[k]).replace(",", ".")) || 0);
    if (!n("ca")){ CALC.msg = "Indiquez au moins votre chiffre d'affaires déclaré."; return renderSection(); }
    const rev = n("ca") - n("cot") - n("dep");
    let key = rev < 0 ? "def" : rev === 0 ? "r0" : Object.keys(REV_B).find(k => { const [lo,hi] = REV_B[k]; return k!=="def" && k!=="r0" && rev >= lo && (hi===null || rev < hi); });
    R.q26 = key; if (!R.q27) R.q27 = "calcul";
    const f2 = v => new Intl.NumberFormat("fr-FR").format(Math.round(v)) + " €";
    CALC.msg = rev < 0 ? `Résultat négatif : ${f2(rev)}. La réponse « déficit » a été cochée ci-dessous.` : `Revenu estimé : <b>${f2(rev)} par an</b>, soit ${f2(rev/12)} par mois. La tranche correspondante a été cochée ci-dessous : vérifiez-la.`;
    renderSection();
  };
  f.onsubmit = e => { e.preventDefault(); if (f.site_web && f.site_web.value) return; validateAndGo(); };
  document.getElementById("back").onclick = () => go(nextStep(step,-1) < 1 ? 0 : nextStep(step,-1));
}

function missing(q){
  if (q.optional) return false;
  const v = R[q.id];
  if (q.type==="multi") return arr(v).length===0;
  if (q.type==="number"){ const n = Number(v); return v===undefined || v==="" || !Number.isInteger(n) || n<q.min || n>q.max; }
  if (q.type==="weeks"){ if (v==="nsp") return false; const n = Number(v); return !v || !Number.isInteger(n) || n<1 || n>openWeeks(R); }
  if (q.type==="offweeks"){ if (v==="nsp") return false; const n = Number(v); return v===undefined || v==="" || !Number.isInteger(n) || n<0 || n>=openWeeks(R); }
  return v===undefined || v==="";
}

function validateAndGo(){
  const sid = SECTIONS[step-1].id;
  const qs = secQs(sid);
  const bad = qs.filter(missing);
  document.querySelectorAll(".q").forEach(el=>{el.classList.remove("err"); el.querySelector(".q-err")?.remove();});
  if (bad.length){
    bad.forEach(q => { const el = document.getElementById("blk-"+q.id); el.classList.add("err");
      const n = document.createElement("div"); n.className="q-err";
      n.textContent = q.type==="offweeks" ? `Indiquez un nombre entier entre 0 et ${openWeeks(R)-1}, ou cochez « Je ne sais pas ».` : q.type==="number"||q.type==="weeks" ? `Indiquez un nombre entier${q.type==="weeks"?` entre 1 et ${openWeeks(R)}`:` entre ${q.min} et ${q.max}`}.` : "Merci de répondre à cette question.";
      el.appendChild(n); });
    document.getElementById("blk-"+bad[0].id).scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  const probe = applyAuto({...R});
  const rules = RULES.filter(r=>r.s===sid && r.test(probe));
  const blocks = rules.filter(r=>r.type==="block");
  if (blocks.length){ renderSection(blocks); window.scrollTo({top:0,behavior:"smooth"}); return; }
  const warns = rules.filter(r=>r.type==="warn");
  if (warns.length && !ackWarn[sid]){
    ackWarn[sid] = true;
    renderSection(warns.map(w=>({...w, msg: w.msg + " Si votre réponse est exacte, cliquez à nouveau sur le bouton pour continuer."})));
    window.scrollTo({top:0,behavior:"smooth"}); return;
  }
  warns.forEach(w=>alertes.add(w.id));
  if (step===1 && R.q1==="non") return submit();
  const n = nextStep(step,1);
  if (n>7) return submit();
  go(n);
}

function go(s){ step = s; if (s===0) renderIntro(); else renderSection(); window.scrollTo({top:0}); }

function buildRow(){
  const r = applyAuto(JSON.parse(JSON.stringify(R)));
  const row = {version: SCHEMA_VERSION};
  Q.forEach(q => { let v = visible(q,r) || ["q14","q14p","q24"].includes(q.id) && inScope(r) ? r[q.id] : "";
    if (Array.isArray(v)) v = v.join("|");
    row[q.id] = v ?? ""; });
  const ww = inScope(r) ? workedWeeks(r) : null;
  row.q20 = ww===null ? (inScope(r) && r.q20c==="nsp" ? "nsp" : "") : ww;
  row.alertes = [...alertes].join("|");
  row.duree_min = Math.round((Date.now()-t0)/60000);
  return row;
}


const RESTITUTION = "Les réponses feront l'objet d'une étude de restitution globale. Elle sera adressée par newsletter à tous les adhérents de la FFPMI, mise à disposition sur le site de la fédération et relayée sur les réseaux sociaux.";
const FBQ = [
  {id:"fb1",type:"single",label:"Les questions correspondaient-elles à votre situation ?",opts:["Oui, tout à fait","En partie","Non"]},
  {id:"fb2",type:"single",label:"Avez-vous pu répondre aux questions sur les montants (chiffre d'affaires, revenu) ?",opts:["Facilement","Avec difficulté","Non"]},
  {id:"fb3",type:"textarea",label:"Certaines questions étaient-elles difficiles à comprendre ou à renseigner ? Lesquelles, et pourquoi ?"},
  {id:"fb4",type:"textarea",label:"Manque-t-il une question ou une réponse importante pour votre situation ?"},
  {id:"fb5",type:"single",label:"La durée du questionnaire vous a paru :",opts:["Trop longue","Correcte","Courte"]},
  {id:"fb6",type:"textarea",label:"Autres remarques"}
];
const FB = {};
function readable(row){
  return Q.filter(q=>row[q.id]!==undefined && row[q.id]!=="").map(q=>{
    const vals = String(row[q.id]).split("|").map(v=> ["number","weeks","offweeks","text","textarea"].includes(q.type) ? v : optLabel(q.id,v));
    return `${q.id.toUpperCase()} : ${vals.join(", ")}`; }).join("\n");
}
function renderFeedback(row){
  app.innerHTML = `<section class="end fb"><span class="accent"></span><h2>Merci d'avoir testé le questionnaire</h2>
    ${excluded(R) ? `<div class="msg warn">Fin du parcours : avec une activité non immatriculée comme artisanale (commerciale, libérale ou inconnue) ou une activité exclusivement d'artiste-auteur, le répondant est hors du champ de l'enquête. Dans la version réelle, le questionnaire s'arrête ici.</div>` : ""}
    <p>${RESTITUTION}</p>
    <p>Vos réponses n'ont pas été enregistrées. Pour finir, quelques questions sur le questionnaire lui-même : vos remarques serviront à l'améliorer avant sa diffusion.</p>
    <form id="fbf">${FBQ.map(q=>`<div class="q"><div class="q-label">${esc(q.label)}</div>${q.type==="single"
      ? `<div class="q-opts">${q.opts.map(o=>`<label class="opt"><input type="radio" name="${q.id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`
      : `<textarea name="${q.id}" maxlength="1500"></textarea>`}</div>`).join("")}
      <label class="consent"><input type="checkbox" id="joinAns" checked> <span>Joindre mes réponses au questionnaire à mon retour (pour vérifier que le parcours est cohérent)</span></label>
      <button type="submit" class="btn-main">Préparer mon retour</button></form><div id="fbOut"></div></section>`;
  const f = document.getElementById("fbf");
  f.addEventListener("change", e => { if (e.target.type==="radio"){ f.querySelectorAll(`input[name=${e.target.name}]`).forEach(i=>i.closest(".opt").classList.toggle("on", i.checked)); } });
  f.onsubmit = e => { e.preventDefault();
    FBQ.forEach(q => { const el = f.elements[q.id]; FB[q.id] = el ? (el.value||"").trim() : ""; });
    const avis = FBQ.map(q=>`${q.label}\n${FB[q.id]||"(pas de réponse)"}`).join("\n\n");
    const text = `RETOUR DE TEST - Baromètre FFPMI 2025\n\n${avis}` + (document.getElementById("joinAns").checked ? `\n\n---\nRÉPONSES DONNÉES AU QUESTIONNAIRE\n${readable(row)}${row.alertes?`\nAvertissements affichés : ${row.alertes}`:""}\nDurée : ${row.duree_min} min` : "");
    const mailBody = text.length < 1800 ? text : `RETOUR DE TEST - Baromètre FFPMI 2025\n\n${avis}`.slice(0,1700) + "\n\n(Collez ici le texte complet copié depuis la page.)";
    const mail = `mailto:${CONFIG.EMAIL_RETOUR}?subject=${encodeURIComponent("Test du Baromètre FFPMI")}&body=${encodeURIComponent(mailBody)}`;
    document.getElementById("fbOut").innerHTML = `<h2 style="margin-top:34px">Votre retour est prêt</h2>
      <p>Copiez ce texte et envoyez-le à ${esc(CONFIG.EMAIL_RETOUR)}, ou utilisez le bouton email si votre appareil le permet.</p>
      <textarea class="out" id="outTxt" readonly>${esc(text)}</textarea>
      <div class="actions"><button class="btn-main" id="copy">Copier le texte</button><a class="btn-ghost" style="border-radius:999px;padding:13px 26px;font-weight:600;border:1.5px solid var(--trait)" href="${mail}" target="_blank" rel="noopener">Envoyer par email</a></div>
      <p class="q-help" id="copyMsg" style="margin-top:10px"></p>`;
    document.getElementById("copy").onclick = async () => { const ta = document.getElementById("outTxt"); let ok = false;
      try { await navigator.clipboard.writeText(ta.value); ok = true; } catch(err){ ta.select(); try { ok = document.execCommand("copy"); } catch(e2){} }
      document.getElementById("copyMsg").textContent = ok ? "Texte copié. Collez-le dans un email à " + CONFIG.EMAIL_RETOUR + "." : "Copie automatique impossible ici : sélectionnez le texte ci-dessus et copiez-le manuellement."; };
    document.getElementById("fbOut").scrollIntoView({behavior:"smooth"}); };
}

async function submit(){
  const row = buildRow();
  app.innerHTML = `<section class="end"><h2>Envoi en cours...</h2></section>`;
  if (CONFIG.MODE_TEST) return renderFeedback(row);
  if (!CONFIG.SUPABASE_URL && !CONFIG.ENDPOINT){
    app.innerHTML = `<section class="end"><span class="accent"></span><h2>Mode test : réponse non envoyée</h2>
      <p>Aucune base de données n'est configurée (CONFIG.SUPABASE_URL et CONFIG.SUPABASE_KEY). Voici la ligne qui aurait été enregistrée :</p>
      <pre class="test">${esc(JSON.stringify(row,null,1))}</pre></section>`;
    return;
  }
  try {
    if (CONFIG.SUPABASE_URL){
      const payload = {}; Object.entries(row).forEach(([k,v]) => payload[k] = (v===undefined || v===null || v==="") ? null : String(v));
      const key = CONFIG.SUPABASE_KEY;
      const headers = {"Content-Type":"application/json", "apikey":key, "Prefer":"return=minimal"};
      if (!key.startsWith("sb_publishable_")) headers.Authorization = "Bearer " + key;
      const res = await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"") + "/rest/v1/barometre_reponses", {method:"POST", headers, body: JSON.stringify(payload)});
      if (!res.ok) throw new Error("HTTP " + res.status);
    } else {
      await fetch(CONFIG.ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(row)});
    }
    try { localStorage.setItem("barometre_ffpmi_2025_envoye","1"); } catch(e){}
    const outScope = R.q1==="non" || excluded(R);
    app.innerHTML = `<section class="end"><span class="accent"></span>
      <h2>${outScope ? "Merci pour votre intérêt" : "Merci, vos réponses sont enregistrées"}</h2>
      <p>${excluded(R) ? "Cette enquête porte sur les photographes exerçant une activité artisanale. Votre situation n'entre pas dans son champ, mais votre réponse a bien été prise en compte et nous vous remercions de votre participation." : outScope ? "Cette enquête concerne les photographes ayant exercé une activité professionnelle indépendante en 2025. Votre réponse a bien été prise en compte." : "Votre participation contribue à faire connaître la réalité économique de notre profession."}</p>
      <p>${RESTITUTION}</p>
      <p>Vous pouvez partager ce questionnaire avec d'autres artisans photographes, adhérents ou non : plus les réponses seront nombreuses, plus les résultats seront fiables.</p></section>`;
  } catch(e){
    app.innerHTML = `<section class="end"><h2>L'envoi n'a pas abouti</h2><p>Vérifiez votre connexion internet, puis réessayez. Vos réponses sont conservées tant que cette page reste ouverte.</p><button class="btn-main" id="retry">Réessayer l'envoi</button></section>`;
    document.getElementById("retry").onclick = submit;
  }
}

renderIntro();
})();
</script>
